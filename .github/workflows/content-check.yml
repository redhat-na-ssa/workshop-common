name: Check content
# Reusable: checks a workshop pull request before it is merged.
#   1. The lines it changes follow the formatting conventions (scripts/check-content.py):
#      no runnable commands in sentences, no code lines too long for the PDF.
#   2. The site builds without Antora warnings, such as an xref to a page that doesn't exist.
#   3. Every link and image inside the built site resolves (scripts/check-links.py).
# All three run even when an earlier one fails, so one run shows every problem.
# The caller grants `contents: read`.
on:
  workflow_call:
    inputs:
      playbook:
        description: Antora playbook that builds the site
        type: string
        default: default-site.yml
      extra-npm-packages:
        description: npm packages to install next to Antora, space-separated
        type: string
        default: ""
      common-ref:
        description: Branch, tag or commit of workshop-common to take the check scripts from
        type: string
        default: main

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the base branch, to find the lines a pull request changes
      - name: checkout workshop-common
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/workshop-common
          ref: ${{ inputs.common-ref }}
          path: .workshop-common
      - name: formatting conventions
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
        run: python3 .workshop-common/scripts/check-content.py --base "$BASE"
      - name: setup node
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v4
        with:
          node-version: 20.13.1
      - name: install antora
        if: ${{ !cancelled() }}
        env:
          EXTRA_NPM_PACKAGES: ${{ inputs.extra-npm-packages }}
        run: |
          # shellcheck disable=SC2086 # the extra packages are a space-separated list
          npm install --global \
            @antora/cli@3.1 \
            @antora/site-generator@3.1 \
            @asciidoctor/tabs@1.0.0-beta.6 \
            $EXTRA_NPM_PACKAGES
      - name: build the site, failing on warnings
        id: build
        if: ${{ !cancelled() }}
        env:
          PLAYBOOK: ${{ inputs.playbook }}
        run: |
          antora generate "$PLAYBOOK" --stacktrace \
            --to-dir "$RUNNER_TEMP/site" \
            --log-failure-level warn
      - name: links
        # Antora writes the site even when it fails on a warning, so check its links too
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        run: python3 .workshop-common/scripts/check-links.py "$RUNNER_TEMP/site"
