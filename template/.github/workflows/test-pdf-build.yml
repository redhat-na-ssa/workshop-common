name: Test PDF Build
# Builds the PDF on pull requests with the shared workflow in @@OWNER@@/workshop-common.
on:
  pull_request:
    paths:
      - 'content/**'
      - 'default-pdf.yml'
      - 'antora-assembler.yml'
      - 'Gemfile'
  workflow_dispatch:  # Allow manual testing

permissions:
  contents: read

jobs:
  test-build:
    uses: @@OWNER@@/workshop-common/.github/workflows/pdf-test.yml@main
