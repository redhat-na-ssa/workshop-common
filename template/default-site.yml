---
site:
  title: "@@TITLE@@"
  # The Pages workflow passes --url with the address GitHub Pages serves the site at.
  url: "https://@@OWNER@@.github.io/@@REPO@@"
  start_page: ROOT::index.adoc

content:
  sources:
    # Each workshop under workshops/, then the home part, which must stay last.
    # add-workshop.py adds workshops above this line
    - url: .
      start_path: content

ui:
  bundle:
    # Showroom theme plus the shared workshop CSS, tabs, copy buttons and footer stamp;
    # see https://github.com/@@OWNER@@/workshop-common
    url: https://github.com/@@OWNER@@/workshop-common/releases/download/ui-bundle/ui-bundle.zip
    snapshot: true
  supplemental_files:
    - path: .nojekyll
    - path: ui.yml
      contents: "static_files: [ .nojekyll ]"

asciidoc:
  extensions:
    - '@asciidoctor/tabs'

runtime:
  cache_dir: ./.cache/antora

output:
  dir: ./www
